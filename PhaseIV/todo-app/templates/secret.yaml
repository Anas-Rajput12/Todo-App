apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-backend-secret
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.backend.secretKey | default "your-secret-key-change-in-production" | quote }}
  COHERE_API_KEY: {{ .Values.backend.cohereApiKey | default "" | quote }}
