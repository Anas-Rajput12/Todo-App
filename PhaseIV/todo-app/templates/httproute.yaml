{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "todo-app.fullname" . -}}
{{- $backendSvcPort := .Values.backend.service.port -}}
{{- $frontendSvcPort := .Values.frontend.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        {{- if contains "/api" (first .matches).path.value }}
        - name: {{ $fullName }}-backend
          port: {{ $backendSvcPort }}
          weight: 1
        {{- else }}
        - name: {{ $fullName }}-frontend
          port: {{ $frontendSvcPort }}
          weight: 1
        {{- end }}
    {{- end }}
{{- end }}
